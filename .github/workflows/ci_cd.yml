name: AutoSIGA CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Criar Ambiente Virtual e Instalar Dependências
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Testes Unitários (Pytest)
        run: |
          .\venv\Scripts\activate
          python -m pytest tests/

  build-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Criar Ambiente Virtual e Instalar Dependências de Compilação
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar Executável (PyInstaller)
        run: |
          .\venv\Scripts\activate
          pyinstaller AutoSIGA.spec

      - name: Compactar Arquivo (.ZIP)
        run: |
          powershell Compress-Archive -Path dist/AutoSiga/* -DestinationPath AutoSiga_Windows.zip

      - name: Criar Release e Fazer Upload do Artefato
        uses: softprops/action-gh-release@v2
        with:
          files: AutoSiga_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
